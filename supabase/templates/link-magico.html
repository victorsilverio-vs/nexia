<div style="background:#F5F3EE;padding:32px 16px;font-family:'Red Hat Display',Arial,sans-serif;color:#0A0A0A">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border-top:4px solid #E7BC21;border-radius:4px;padding:32px 24px">
    <p style="margin:0 0 24px;font-weight:800;font-size:20px;letter-spacing:3px">NEXIA</p>
    <h1 style="margin:0 0 12px;font-size:22px">Seu link de acesso</h1>
    <p style="margin:0 0 24px;line-height:1.5">Toque no botão para entrar na NEXIA. O link vale por 1 hora e funciona uma vez só.</p>
    <p style="margin:0 0 24px">
      <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email"
         style="display:inline-block;background:#E7BC21;color:#0A0A0A;font-weight:700;text-decoration:none;padding:14px 24px">Entrar na NEXIA</a>
    </p>
    <p style="margin:0;color:#5C5852;font-size:14px;line-height:1.5">Se você não pediu este acesso, ignore este e-mail. Ninguém entra na sua conta sem este link.</p>
  </div>
  <p style="max-width:480px;margin:16px auto 0;color:#A29D93;font-size:12px;text-align:center">NEXIA · Ecossistema VS</p>
</div>
