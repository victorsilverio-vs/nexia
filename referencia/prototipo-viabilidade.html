<style>
/* Layout: assistente em 6 telas à esquerda, tela de trabalho no centro, faixa de indicadores fixa embaixo. */

  --c1:#0d6b57; --c2:#c9812b; --c3:#3a5ba0; --c4:#8a8f8c;
  --font-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --font-b:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --font-m:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a211d; --surface2:#232c27; --line:#33403a; --fg:#e8eeea; --muted:#9baba3;
  --accent:#4fc4a5; --accent-fg:#06231b; --accent-soft:#17382f;
  --warn:#f0b35a; --warn-soft:#3a2c10; --bad:#ff8f86; --bad-soft:#40201d; --good:#6fd596; --good-soft:#163a25;
  --c1:#4fc4a5; --c2:#e8a553; --c3:#8aa6e8; --c4:#8a948f; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --surface2:#232c27; --line:#33403a; --fg:#e8eeea; --muted:#9baba3;
  --accent:#4fc4a5; --accent-fg:#06231b; --accent-soft:#17382f;
  --warn:#f0b35a; --warn-soft:#3a2c10; --bad:#ff8f86; --bad-soft:#40201d; --good:#6fd596; --good-soft:#163a25;
  --c1:#4fc4a5; --c2:#e8a553; --c3:#8aa6e8; --c4:#8a948f; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 84px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 0 12px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.title-in{font-family:var(--font-d);font-size:26px;font-weight:600;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--fg);padding:2px 0;min-width:0;width:min(520px,100%)}
.title-in:focus{outline:none;border-bottom-color:var(--accent)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.step:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.steps{position:sticky;top:10px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.step{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer}
.step:hover{background:var(--surface2)}
.step[aria-current="step"]{background:var(--accent-soft);font-weight:600}
.dot{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-family:var(--font-m);border:1.5px solid var(--line);color:var(--muted)}
.dot.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.dot.warn{border-color:var(--warn);color:var(--warn)}
.sep{height:1px;background:var(--line);margin:6px 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 22px 26px;min-width:0}
.panel h2{font-size:22px}
.lead{color:var(--muted);margin:4px 0 16px;max-width:68ch}
.banner{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13.5px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sec{margin-top:22px}
.sec>h3{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-b);font-weight:600;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:13px;font-weight:600}
.f .hint{font-size:12px;color:var(--muted);line-height:1.35}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.inp:focus-within{border-color:var(--accent)}
.inp input,.inp select{border:0;background:transparent;padding:8px 10px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.inp input:focus,.inp select:focus{outline:none}
.inp .u{padding:0 10px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.inp select{cursor:pointer}
.inp select option{background:var(--surface);color:var(--fg)}
.out{background:var(--surface2);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums;font-weight:600}
.row-note{font-size:13px;color:var(--muted);margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;text-align:right;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl td .inp{background:var(--bg)}
.tbl tfoot td{font-weight:600;border-bottom:0}
.scroll{overflow-x:auto}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1180px;margin:0 auto;display:flex;gap:6px 22px;flex-wrap:wrap;align-items:center}
.k{display:flex;flex-direction:column;min-width:84px}
.k span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.k b{font-family:var(--font-m);font-size:14px;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)} .pos{color:var(--good)}
.bar .sp{flex:1}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);min-width:0}
.card span{font-size:12px;color:var(--muted);display:block}
.card b{font-family:var(--font-m);font-size:20px;font-variant-numeric:tabular-nums;display:block;margin:2px 0}
.card small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.verdict{border-radius:10px;padding:14px 16px;margin:14px 0;line-height:1.5}
.verdict.good{background:var(--good-soft)} .verdict.bad{background:var(--bad-soft)} .verdict.warn{background:var(--warn-soft)}
.verdict h3{font-size:17px;margin-bottom:4px}
.issues{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.issues li{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
.issues button{border:0;background:transparent;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-b)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mat{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.mat h4{margin:0 0 6px;font-size:13px;font-family:var(--font-b)}
.mt{width:100%;border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums}
.mt th{font-size:11px;color:var(--muted);font-weight:600;padding:2px 4px}
.cell{border:0;width:100%;border-radius:6px;padding:8px 4px;font-size:12.5px;cursor:pointer;color:#10201a;font-family:var(--font-m)}
.cell[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:1px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.who{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.who h4{margin:0 0 6px;font-size:14px;font-family:var(--font-b)}
.who dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13.5px}
.who dt{color:var(--muted)} .who dd{margin:0;text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums}
.sel{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
textarea.json{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--font-m);font-size:12px}
/* seletor de cenário fixo no topo do resultado */
.stick{position:sticky;top:0;z-index:15;background:var(--surface);margin:0 -22px 16px;padding:9px 22px 10px;border-bottom:1px solid var(--line);box-shadow:0 6px 10px -8px rgba(0,0,0,.25)}
.stick-t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.stick-in{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.sg{display:flex;align-items:center;gap:7px}.sg>span{font-size:12px;color:var(--muted)}
.stick .seg button{padding:5px 10px;font-size:12.5px}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .steps{position:static;flex-direction:row;overflow-x:auto;padding:6px}
  .step{white-space:nowrap;flex:none}.sep{display:none}
  .panel{padding:16px 14px 22px}
  .stick{margin:0 -14px 14px;padding:7px 14px 8px}.stick-in{gap:5px 10px}.stick-t{display:none}.sg{width:100%;justify-content:space-between}.sg .seg{flex:1;max-width:none}.sg .seg button{flex:1}
  .bar-in{gap:4px 14px}.k{min-width:70px}.k b{font-size:12.5px}
  .bar .sp{display:none}
}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}

.lock-note{background:var(--surface2);border:1px solid var(--line,#ccc);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
input:disabled,select:disabled,textarea:disabled{opacity:.85;cursor:not-allowed}
button[data-forma]:disabled,button[data-am]:disabled,button[data-tp]:disabled,button[data-md]:disabled{cursor:not-allowed}
.title-in[readonly]{cursor:default}

<script>
/* Motor de cálculo — Estudo de Viabilidade (protótipo)
   Port fiel da planilha ECO-EVF-09 (aba Fluxo de Caixa / Dashboard). Funções puras, sem tela. */
(function (root) {
  var N = 180;           // meses simulados
  var EPS = 1e-6;

  function curvaVenda(tipo, dur) {
    // pesos iguais aos da aba "Cenários de Venda": Lento m^1,5*(D-m+1)^0,6 · Base m*(D-m+1) · Rápido m^0,6*(D-m+1)^1,5
    var a = { lento: [1.5, 0.6], base: [1, 1], rapido: [0.6, 1.5] }[tipo];
    var w = [0], tot = 0, m;
    for (m = 1; m <= 60; m++) {
      var v = m <= dur ? Math.pow(m, a[0]) * Math.pow(dur - m + 1, a[1]) : 0;
      w.push(v); tot += v;
    }
    return w.map(function (v) { return tot ? v / tot : 0; });   // índice = mês (1..60)
  }
  function curvaObra(dur) {   // curva-S: m^2 * (D-m+1)^1,5
    var w = [0], tot = 0, m;
    for (m = 1; m <= 60; m++) { var v = m <= dur ? m * m * Math.pow(dur - m + 1, 1.5) : 0; w.push(v); tot += v; }
    return w.map(function (v) { return tot ? v / tot : 0; });
  }

  function irr(cf) {
    var f = function (r) { var s = 0; for (var t = 0; t < cf.length; t++) s += cf[t] / Math.pow(1 + r, t); return s; };
    var lo = -0.5, hi = 1.5, flo = f(lo), fhi = f(hi);
    if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
    for (var i = 0; i < 200; i++) { var mid = (lo + hi) / 2, fm = f(mid); if (flo * fm <= 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; } }
    return (lo + hi) / 2;
  }
  function mirr(cf, fin, rei) {
    var T = cf.length - 1, fv = 0, pv = 0, t;
    for (t = 0; t <= T; t++) { if (cf[t] > 0) fv += cf[t] * Math.pow(1 + rei, T - t); else if (cf[t] < 0) pv += cf[t] / Math.pow(1 + fin, t); }
    if (fv <= 0 || pv >= 0) return null;
    return Math.pow(fv / -pv, 1 / T) - 1;
  }
  function npv(rate, cf) { var s = 0; for (var t = 0; t < cf.length; t++) s += cf[t] / Math.pow(1 + rate, t); return s; }

  /* p = premissas; sc = {venda:'lento|base|rapido', custo:'base|ot|pe', preco:'base|ot|pe'} */
  function simular(p, sc) {
    var durV = { lento: p.durLento, base: p.durBase, rapido: p.durRapido }[sc.venda];
    var mPreco = { base: 1, ot: 1 + p.varPreco, pe: 1 - p.varPreco }[sc.preco];
    var mCusto = { base: 1, ot: 1 + p.varCustoOt, pe: 1 + p.varCustoPe }[sc.custo];
    var VGV = p.areaVenda * p.preco * mPreco;
    var custoObra = p.custoObraBase * mCusto;
    var s = curvaVenda(sc.venda, durV), cv = curvaObra(p.obra);
    var C9 = p.lanc, C10 = p.obra, C11 = C9 + C10, corr = p.ipca + p.atualiz;
    var preObra = p.preObra, I17 = preObra * p.aporteEf;
    var T = Math.round(p.scpPrazo), cap = p.fundoLimite, i = p.scpJuros;
    var corr1 = Math.pow(1 + i, T);

    // ---------- recebíveis ----------
    function sv(j) { return j >= 1 && j <= 60 ? s[j] : 0; }
    var D = [0], B = [0], Cp = [0];
    var m, j;
    for (m = 1; m <= N; m++) {
      var b = p.entrada * sv(m) * VGV;
      if (m <= C11) {
        var sp = 0, sr = 0;
        for (j = 1; j < m && j < C11; j++) sp += sv(j) / (C11 - j);
        b += p.parcelas * VGV * sp;
        for (j = 1; j < m && j < C11; j++) { var d = m - j, k = Math.floor((C11 - j) / 12); if (d % 12 === 0 && k > 0) sr += sv(j) / k; }
        b += p.reforcos * VGV * sr;
      }
      if (m === C11) {
        var sa = 0, sb = 0;
        for (j = 1; j < C11; j++) { sa += sv(j); if (C11 - j < 12) sb += sv(j); }
        b += p.chaves * VGV * sa + p.reforcos * VGV * sb;
      }
      if (m >= C11) b += (p.parcelas + p.reforcos + p.chaves) * sv(m) * VGV;
      var c = 0;
      if (p.pos > 0 && p.posMeses > 0) {
        var denMax = 1;
        if (p._legadoPos) for (j = 1; j <= 60; j++) denMax = Math.max(denMax, j + p.posMeses - (C11 >= j ? C11 : j));
        for (j = 1; j <= 60; j++) {
          if (sv(j) <= 0) continue;
          var st = C11 >= j ? C11 : j;              // pós-chaves começa no mês seguinte à entrega (ou à venda, se vendeu depois)
          if (p._legadoPos) {                       // comportamento da planilha antiga (só para testes de comparação)
            if (m >= st + 1 && m <= j + p.posMeses)
              c += p.pos * VGV * sv(j) / denMax * Math.pow(1 + corr, m - j);
          } else if (m >= st + 1 && m <= st + p.posMeses) {   // N parcelas iguais após a entrega, corrigidas
            c += p.pos * VGV * sv(j) / p.posMeses * Math.pow(1 + corr, m - j);
          }
        }
      }
            B.push(b); Cp.push(c); D.push(b + c);
    }

    // ---------- custos e fluxo ----------
    var E = [0], F = [0], G = [0], H = [0], Iop = [0], be = null, Rep = [0];
    var pF = p.permutaFin || 0, fee = p.descTaxa ? p.taxaAdm : 0;   // permuta financeira: % repassada ao terrenista
    for (m = 1; m <= N; m++) {
      var k2 = m - C9, e = (k2 >= 1 && k2 <= C10) ? cv[k2] * custoObra : 0;
      E.push(e); F.push(F[m - 1] + e); G.push(custoObra ? F[m] / custoObra : 0);
      var h = 0;
      if (m <= C9 && C9 > 0) h += p.mktLanc * p.mkt * VGV / C9;
      else if (m > C9 && m <= 2 * C9 && C9 > 0) h += (1 - p.mktLanc) * p.mkt * VGV / C9;
      if (m <= C11 && C11 > 0) h += (p.taxaAdm + (p.taxasPct || 0)) * VGV / C11;   // taxas e custos gerais (% VGV) + taxa de incorporação, diluídas até a entrega
      if (m === 1) h += p.infra + (preObra - I17);
      h += p.admObra * e + p.impostos * D[m] + p.corretagem * sv(m) * VGV;
      if (m === C11) h += p.fundoPos * custoObra;
      var rep = pF * ((1 - p.impostos - fee) * D[m] - p.corretagem * sv(m) * VGV);   // repasse líquido de imposto e corretagem
      Rep.push(rep); h += rep;
      H.push(h);
      Iop.push(Iop[m - 1] + D[m] - e - h);
      if (be === null && Iop[m] >= 0) be = m;
    }
    var C41 = Math.max(p.scpCarencia, be === null ? 0 : be);
    var limite = p.scpPrimeiro + T;

    // ---------- captação (Fundo / SCP) ----------
    var Q = [0], U = [0], V = [0], W = [-I17];
    var Ka = [0], Ra = [0], Sa = [0], Oa = [0], Pa = [0], Ta = [0], Xa = [0], flagSCP = [0], posCaixa = [0];
    var sumK = 0, sumR = 0, sumS = 0, sumO = 0, picoExp = 0, mesFundo = null, mesQuitSCP = null;
    for (m = 1; m <= N; m++) {
      var op = D[m] - E[m] - H[m];
      var Kj = Q[m - 1] * p.fundoJuros;
      var L = V[m - 1] + op - Kj, M = Math.max(0, -L), Nn = Math.max(0, L);
      var Rj = U[m - 1] * i, bal = U[m - 1] + Rj;
      var fundoOn = G[m] >= p.pctFundo;
      var fun = p.quitarFundo && fundoOn, X;
      if (p.scpContagem === 'cada') {
        if (fun) X = bal;
        else { var due = (m - T >= 1) ? Sa[m - T] * corr1 : 0; X = (bal - due < 0.5) ? bal : due; }
        if (X < EPS) X = 0;
      } else {
        X = ((m >= limite || fun) && bal > EPS) ? bal : 0;
      }
      var F1 = fundoOn ? Math.min(M, Math.max(0, cap - Q[m - 1])) : 0;
      var Pj = m >= p.fundoCarencia ? Math.min(Nn, Q[m - 1]) : 0;
      var extra = X > 0 ? Math.min(Math.max(0, X - Math.max(0, Nn - Pj)), Math.max(0, cap - Q[m - 1] - F1)) : 0;
      var Oj = F1 + extra;
      var Sj = M - F1;
      var Tj = X > 0 ? Math.min(X, Math.max(0, Nn - Pj) + extra)

/* ---------- gráficos (SVG feito à mão, escala única) ---------- */
function nice(max,min){var span=(max-min)||1,raw=span/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag,st=(n<1.5?1:n<3?2:n<7?5:10)*mag;
  var lo=Math.floor(min/st)*st,hi=Math.ceil(max/st)*st,t=[];for(var v=lo;v<=hi+st/2;v+=st)t.push(v);return {lo:lo,hi:hi,t:t}}
function ylab(v){var a=Math.abs(v);return (v<0?'−':'')+(a>=1e6?(a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' Mi':a>=1e3?nf0.format(a/1e3)+' mil':nf0.format(a))}
function chart(series,H,opts){var W=760,h=250,L=58,R=14,T=12,B=28,n=H+1;
  var all=[];series.forEach(function(s){s.v.slice(0,n).forEach(function(x){all.push(x)})});
  var sc=nice(Math.max.apply(null,all.concat([0])),Math.min.apply(null,all.concat([0])));
  function X(i){return L+(W-L-R)*i/Math.max(1,H)}function Y(v){return T+(h-T-B)*(1-(v-sc.lo)/(sc.hi-sc.lo))}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+h+'" role="img" aria-label="'+esc(opts.label)+'">';
  sc.t.forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="'+(v===0?1.6:0.6)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+ylab(v)+'</text>'});
  for(var i=0;i<=H;i+=(H>60?12:6)){s+='<text x="'+X(i)+'" y="'+(h-8)+'" text-anchor="middle">'+i+'</text>'}
  s+='<text x="'+L+'" y="'+(h-8)+'" text-anchor="end" style="font-size:10px" dx="-6">mês</text>';
  series.forEach(function(se){var pts=se.v.slice(0,n).map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)});
    if(se.area){var p0=Y(0);s+='<polygon points="'+X(0)+','+p0+' '+pts.join(' ')+' '+X(n-1)+','+p0+'" fill="'+se.c+'" fill-opacity=".16"/>'}
    s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+se.c+'" stroke-width="2" stroke-linejoin="round"/>';
    var lv=se.v[n-1];s+='<circle cx="'+X(n-1)+'" cy="'+Y(lv)+'" r="3.5" fill="'+se.c+'"/>'});
  return s+'</svg>'}
function stack(a,b,H,label){var W=760,h=230,L=58,R=14,T=12,B=28,n=H+1,tot=[],mx=0;for(var i=0;i<n;i++){tot.push(a[i]+b[i]);mx=Math.max(mx,tot[i])}
  var sc=nice(mx||1,0);function X(i){return L+(W-L-R)*i/Math.max(1,H)}function Y(v){return T+(h-T-B)*(1-v/sc.hi)}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+h+'" role="img" aria-label="'+esc(label)+'">';
  sc.t.forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width=".6"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+ylab(v)+'</text>'});
  for(var j=0;j<=H;j+=(H>60?12:6))s+='<text x="'+X(j)+'" y="'+(h-8)+'" text-anchor="middle">'+j+'</text>';
  var pa=[],pb=[];for(var k=0;k<n;k++){pa.push(X(k).toFixed(1)+','+Y(b[k]).toFixed(1));pb.push(X(k).toFixed(1)+','+Y(tot[k]).toFixed(1))}
  s+='<polygon points="'+X(0)+','+Y(0)+' '+pa.join(' ')+' '+X(n-1)+','+Y(0)+'" fill="var(--c3)" fill-opacity=".55"/>';
  s+='<polygon points="'+pa.join(' ')+' '+pb.slice().reverse().join(' ')+'" fill="var(--c2)" fill-opacity=".7"/>';
  return s+'</svg>'}

/* ---------- resultado ---------- */
var metric='lucro';
var METS={lucro:{n:'Lucro',f:function(r){return r.lucro},fmt:function(v){return ylab(v)}},margem:{n:'Margem',f:function(r){return r.margem},fmt:function(v){return pc(v,1)}},
  tir:{n:'TIR a.a.',f:function(r){return r.tirA},fmt:function(v){return pc(v,0)}},vpl:{n:'VPL',f:function(r){return r.vpl},fmt:function(v){return ylab(v)}}};
function heat(v,lo,hi){if(v==null)return 'var(--surface2)';var x=hi===lo?.5:(v-lo)/(hi-lo),h=x<.5?8+x*2*40:48+(x-.5)*2*97;return 'hsl('+h.toFixed(0)+',62%,'+(80-Math.abs(x-.5)*6)+'%)'}
function matHtml(){var m=cache.m27,me=METS[metric],vals=m.map(me.f).filter(function(x){return x!=null}),lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  var best=-1,worst=-1;m.forEach(function(r,i){var v=me.f(r);if(v==null)return;if(best<0||v>me.f(m[best]))best=i;if(worst<0||v<me.f(m[worst]))worst=i});
  var h='<div class="mat">';VV.forEach(function(v,vi){h+='<div><h4>'+NOMEV[v]+' ('+[S.vendas.durLento,S.vendas.durBase,S.vendas.durRapido][vi]+' meses)</h4><table class="mt"><thead><tr><th></th>'+CC.map(function(p){return '<th>'+NOMEP[p].replace('Preço ','')+'</th>'}).join('')+'</tr></thead><tbody>';
    CC.forEach(function(c,ci){h+='<tr><th scope="row">'+NOMEC[c].replace('Custo ','')+'</th>';CC.forEach(function(p,pi){var i=vi*9+ci*3+pi,r=m[i],val=me.f(r),on=idx(S.sel)===i;
      h+='<td><button type="button" class="cell" data-cell="'+i+'" aria-pressed="'+on+'" style="background:'+heat(val,lo,hi)+'" title="'+NOMEV[v]+' · '+NOMEC[c]+' · '+NOMEP[p]+'">'+(val==null?'n/d':me.fmt(val))+(i===best?' ▲':i===worst?' ▼':'')+'</button></td>'});h+='</tr>'});h+='</tbody></table></div>'});
  return h+'</div><p class="row-note">▲ melhor cenário · ▼ pior cenário. Linhas: custo de obra. Colunas: preço de venda. Clique para ver o cenário em detalhe.</p>'}
function s6(){var r=cache.sel,vd=veredito(r),pend=cache.pend;
  var h='<h2>Resultado</h2>';
  h+='<div class="verdict '+vd.c+'"><h3>'+esc(vd.h)+'</h3><div>'+esc(vd.t)+'</div></div>';
  if(pend.length){h+='<div class="sec" style="margin-top:0"><h3>Pendências e observações</h3><ul class="issues">'+pend.map(function(x){return '<li><span class="chip '+(x.sev==='imp'?'bad':'warn')+'">'+(x.sev==='imp'?'impede':'atenção')+'</span><span>'+esc(x.m)+' <button type="button" data-go="'+x.st+'">ir para '+STEPS[x.st]+'</button></span></li>'}).join('')+'</ul></div>'}
  if(!cache.m27)return h+'<p class="row-note">Preencha produto, obra e vendas para ver os gráficos.</p>';
  var SH={venda:{lento:'Lenta',base:'Base',rapido:'Rápida'},custo:{base:'Esperado',ot:'Reduzido',pe:'Aumentado'},preco:{base:'Médio',ot:'Otimista',pe:'Pessimista'}},LB={venda:'Venda',custo:'Custo de obra',preco:'Preço'};
  h+='<div class="stick" role="region" aria-label="Cenário em análise"><div class="stick-t">Cenário em análise</div><div class="stick-in">'+
   [['venda',VV],['custo',CC],['preco',CC]].map(function(g){return '<div class="sg"><span>'+LB[g[0]]+'</span><div class="seg" role="group" aria-label="'+LB[g[0]]+'">'+g[1].map(function(k){return '<button type="button" data-sc="'+g[0]+':'+k+'" aria-pressed="'+(S.sel[g[0]]===k)+'">'+SH[g[0]][k]+'</button>'}).join('')+'</div></div>'}).join('')+'</div></div>';
  var n=r.mesFinal;
  h+='<div class="sec"><div class="cards">'+
   card(cache.t.pF>0?'VGV (100% à venda)':'VGV líquido',mi(cache.t.vgvLiq),cache.t.pF>0?'Você vende tudo e repassa '+pc(cache.t.pF,1)+' ao dono do terreno.':'Preço cheio das unidades à venda, sem a permuta.')+card('Receita recebida',mi(r.vgvRecebido),'O que entra no caixa, já com a correção do pós-chaves.')+
   card('Lucro',mi(r.lucro),pc(r.margem,1)+(cache.t.pF>0?' da sua receita (sem a parte do terrenista)':' da receita'),r.lucro<0?'neg':'')+card('VPL',mi(r.vpl),'Quanto sobra, em valor de hoje, acima da TMA de '+pc(S.capital.tma,1)+'.',r.vpl<0?'neg':'')+
   card('TIR',pc(r.tirA,1)+' a.a.','Rendimento anual do capital do incorporador.')+card('MTIR',pc(r.mtirA,1)+' a.a.','Igual à TIR, mas assume que o dinheiro é reaplicado à TMA. Mais realista.')+
   card('Pico de dívida',mi(r.picoExp),'Maior soma de SCP + Fundo devida ao mesmo tempo.')+card('Seu capital',mi(r.I17),'Aportado no início, antes da captação.')+'</div></div>';
  var H=Math.min(Math.max(n+3,S.obra.lanc+S.obra.prazo+6),100);
  var s1=r.serie.fluxoAcum.slice(0,H+1),s2=r.serie.Iop.slice(0,H+1);
  h+='<div class="sec"><h3>Fluxo de caixa acumulado</h3>'+chart([{v:s2,c:'var(--c3)',area:true},{v:s1,c:'var(--c1)'}],H,{label:'Fluxo de caixa acumulado do empreendimento e do incorporador por mês'})+
   '<div class="legend"><span><i style="background:var(--c3)"></i>Empreendimento (antes de captar dinheiro)</span><span><i style="background:var(--c1)"></i>Incorporador (depois de SCP e Fundo)</span></div></div>';
  h+='<div class="sec"><h3>Dívida mês a mês</h3>'+stack(r.serie.U.slice(0,H+1),r.serie.Q.slice(0,H+1),H,'Saldo devedor de SCP e Fundo por mês')+
   '<div class="legend"><span><i style="background:var(--c3);opacity:.7"></i>Fundo / banco</span><span><i style="background:var(--c2)"></i>Investidor SCP</span></div></div>';
  h+='<div class="sec"><h3>Os 27 cenários</h3><div class="sel" style="margin-bottom:10px"><div class="seg" role="group" aria-label="Indicador">'+Object.keys(METS).map(function(k){return '<button type="button" data-met="'+k+'" aria-pressed="'+(metric===k)+'">'+METS[k].n+'</button>'}).join('')+'</div></div>'+matHtml()+'</div>';
  var P=cache.P,t=cache.t,perm=t.vgvPerm,vp=S.terreno.vp,fin=t.pF>0,tcap=perm>0&&vp>0?Math.pow(perm/vp,12/(P.lanc+P.obra))-1:null;
  h+='<div class="sec"><h3>Retorno de cada parte</h3><div class="two">'+
   who('Investidor SCP',[['Aporta',brl(r.capSCP)],['Recebe de juros',brl(r.jurosSCP)],['Múltiplo do capital',r.capSCP?num(1+r.jurosSCP/r.capSCP,2)+'×':'—'],['Taxa contratada',pc(Math.pow(1+S.capital.scpJuros,12)-1,1)+' a.a.']])+
   who('Incorporador',[['Aporta',brl(r.I17)],['Lucro',brl(r.lucro)],['TIR',pc(r.tirA,1)+' a.a.'],['MTIR',pc(r.mtirA,1)+' a.a.']])+
   who('Fundo / banco',[['Capta',brl(r.capFundo)],['Juros pagos',brl(r.jurosFundo)],['Entra no mês',r.mesFundo?String(r.mesFundo):'—'],['Limite',brl(S.capital.fundoLimite)]])+
   (fin?who('Dono do terreno (permuta financeira)',[['Recebe em dinheiro',brl(r.repasse)],['Valor do terreno hoje',vp>0?brl(vp):'—'],['Ganho',vp>0?brl(r.repasse-vp):'—'],['Taxa anual',r.tirTerrA==null?'—':pc(r.tirTerrA,1)]]):
    who('Dono do terreno'+(perm>0?' (permuta física)':''),[['Recebe em unidades',brl(perm)],['Valor do terreno hoje',vp>0?brl(vp):'—'],['Ganho',perm>0&&vp>0?brl(perm-vp):'—'],['Taxa anual',tcap==null?'—':pc(tcap,1)]]))+'</div></div>';
  h+='<div class="sec"><h3>Resumo dos custos</h3><div class="two"><div class="who"><dl>'+
   [['Pré-obra e capital próprio',r.I17],['Construção',r.construcao],['Marketing, taxas, impostos e corretagem',r.outros],['Juros do SCP',r.jurosSCP],['Juros do Fundo',r.jurosFundo]].map(function(x){return '<dt>'+x[0]+'</dt><dd>'+brl(x[1])+'</dd>'}).join('')+
   '<dt><b>Custo total</b></dt><dd><b>'+brl(r.custoTotal)+'</b></dd></dl></div><div class="who"><p class="row-note" style="margin:0">Receita recebida de '+brl(r.vgvRecebido)+' menos custo total de '+brl(r.custoTotal)+' dá o lucro de <b>'+brl(r.lucro)+'</b>. Estudo calculado por regras fixas, sem inteligência artificial nos números. Projeções não são garantia de resultado.</p></div></div></div>';
  return h}
function card(l,v,s,c){return '<div class="card"><span>'+l+'</span><b class="'+(c||'')+'">'+v+'</b><small>'+s+'</small></div>'}
function who(t,rows){return '<div class="who"><h4>'+t+'</h4><dl>'+rows.map(function(x){return '<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>'}).join('')+'</dl></div>'}

/* ---------- montagem ---------- */
var BUILD=[s0,s1,s2,s3,s4,s5,s6];
function render(keepScroll){recompute();var y=window.scrollY;
  $('#app').innerHTML='<div class="wrap"><div class="top"><div><div class="brand">Estudo de viabilidade</div><input class="title-in" id="title" aria-label="Nome do estudo" value="'+esc(S.nome)+'"></div>'+
   '<div class="top-actions"><button class="btn" data-act="theme" type="button">Tema</button></div></div>'+
   '<div class="layout">'+stepsHtml()+'<main class="panel" id="panel">'+BUILD[step]()+(step<6?'<div class="nav"><button class="btn" data-go="'+Math.max(0,step-1)+'" type="button"'+(step===0?' disabled':'')+'>← Voltar</button><button class="btn primary" data-go="'+(step+1)+'" type="button">'+(step===5?'Ver resultado':'Continuar')+' →</button></div>':'')+'</main></div></div><div class="bar" id="bar"></div>';
  refreshOuts();rowTotals();bar();if(LOCK)lockUI();window.scrollTo(0,keepScroll?y:0)}
function lockUI(){
  $$('#app input,#app select,#app textarea').forEach(function(e){e.disabled=true});
  var t=$('#title');if(t){t.disabled=false;t.readOnly=true}
  $$('[data-act="copy"],[data-act="exemplo"],[data-act="zero"],[data-act="import"],[data-act="addtip"],[data-del],.banner').forEach(function(e){e.remove()});
  $$('textarea.json').forEach(function(e){var c=e.closest('.sec');if(c)c.remove()});
  $$('[data-forma],[data-am],[data-tp],[data-md]').forEach(function(e){e.disabled=true});
  if(!$('.lock-note')){var w=$('.wrap'),n=document.createElement('div');n.className='lock-note';
    n.innerHTML='<b>Versão para consulta.</b> Os números do estudo estão travados. Use os botões de cenário (venda, custo de obra e preço) e os indicadores para ver como o resultado muda.';
    w.insertBefore(n,w.firstChild)}}
function rowTotals(){$$('[data-rowv]').forEach(function(e){var r=S.tip[+e.getAttribute('data-rowv')];e.textContent=brl((r.u||0)*(r.a||0)*(r.p||0))});
  $$('[data-rowperm]').forEach(function(e){var r=S.tip[+e.getAttribute('data-rowperm')];e.textContent=brl(Math.min(r.perm||0,r.u||0)*(r.a||0)*(r.p||0))})}
function light(){recompute();refreshOuts();rowTotals();bar();var s=$('.steps');if(s){var t=document.createElement('div');t.innerHTML=stepsHtml();s.replaceWith(t.firstChild)}}

document.addEventListener('input',function(e){if(LOCK)return;var el=e.target,p=el.getAttribute&&el.getAttribute('data-path');if(!p)return;var ty=el.getAttribute('data-type');
  var v=ty==='txt'||ty==='sel'?el.value:parseIn(el.value,ty);sp(S,p,v);if(p==='nome'){var t=$('#title');if(t&&t!==el)t.value=v}S.exemplo=S.exemplo&&p==='nome';save();if(p!=='nome'&&p!=='local'&&p!=='resp'&&p!=='mesBase')light()});
document.addEventListener('change',function(e){if(LOCK)return;var el=e.target,p=el.getAttribute&&el.getAttribute('data-path');if(!p)return;var ty=el.getAttribute('data-type');
  if(ty==='sel'){light();return}if(ty!=='txt'){el.value=fmtIn(gp(S,p),ty,+el.getAttribute('data-dec'))}});
document.addEventListener('input',function(e){if(LOCK)return;if(e.target.id==='title'){S.nome=e.target.value;save()}});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(LOCK){var okL=b.id==='go-res'||b.hasAttribute('data-go')||b.hasAttribute('data-sc')||b.hasAttribute('data-cell')||b.hasAttribute('data-met')||b.getAttribute('data-act')==='theme';if(!okL)return}
  if(b.id==='go-res'){step=step===6?1:6;render();return}
  var g=b.getAttribute('data-go');if(g!=null){step=Math.min(6,Math.max(0,+g));render();return}
  var f=b.getAttribute('data-forma');if(f){S.terreno.forma=f;save();render(true);return}
  var am=b.getAttribute('data-am');if(am){var tt=tot();if(am==='comum'){S.area.comum=Math.max(0,Math.round((S.area.total-tt.areaTot)*100)/100)}else{S.area.total=Math.round((tt.areaTot+(S.area.comum||0))*100)/100}S.area.modo=am;save();render(true);return}
  var tp=b.getAttribute('data-tp');if(tp){S.terreno.perm.tipo=tp;save();render(true);return}
  var md=b.getAttribute('data-md');if(md){S.terreno.perm.modo=md;save();render(true);return}
  var sc=b.getAttribute('data-sc');if(sc){var q=sc.split(':');S.sel[q[0]]=q[1];save();render(true);return}
  var ce=b.getAttribute('data-cell');if(ce!=null){var i=+ce;S.sel={venda:VV[Math.floor(i/9)],custo:CC[Math.floor(i/3)%3],preco:CC[i%3]};save();render(true);return}
  var mt=b.getAttribute('data-met');if(mt){metric=mt;render(true);return}
  var d=b.getAttribute('data-del');if(d!=null){if(S.tip.length>1)S.tip.splice(+d,1);save();render(true);return}
  var a=b.getAttribute('data-act');
  if(a==='addtip'){S.tip.push({n:'Tipologia '+(S.tip.length+1),u:0,a:0,p:S.tip.length?S.tip[S.tip.length-1].p:0,perm:0});save();render(true)}
  else if(a==='zero'){S=vazio();step=0;save();render()}
  else if(a==='exemplo'){S=exemplo();step=0;save();render()}
  else if(a==='theme'){var r=document.documentElement,cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark')}
  else if(a==='copy'){var txt=JSON.stringify(S),ta=$('#json');ta.value=txt;ta.select();var ok=function(){$('#jmsg').textContent='Código copiado. Cole em outro navegador usando Importar.'};
    try{navigator.clipboard.writeText(txt).then(ok,function(){$('#jmsg').textContent='Selecione o texto da caixa e copie (Ctrl+C).'})}catch(x){$('#jmsg').textContent='Selecione o texto da caixa e copie (Ctrl+C).'}}
  else if(a==='import'){try{var o=JSON.parse($('#json').value);if(!(o&&o.tip&&o.capital&&o.obra))throw 0;S=norm(o);S.exemplo=false;save();step=0;render()}catch(x){$('#jmsg').textContent='Código inválido. Confira se copiou o estudo inteiro.'}}});

S=load()||vazio();render();
})();
</script>
